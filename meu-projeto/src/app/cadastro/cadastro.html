```html
<div class="cadastro-container">

  <div class="logo">🌱</div>
  <h1>EcoBairro</h1>
  <p class="subtitulo">Reciclagem e cuidado do bairro</p>

  <div class="alternar">
    <a routerLink="/login">Entrar</a>
    <a class="ativo" routerLink="/cadastro">Criar conta</a>
  </div>

  <form (ngSubmit)="cadastrar()" #formCadastro="ngForm">

    <label for="nome">Nome</label>
    <input
      id="nome"
      name="nome"
      type="text"
      placeholder="Seu nome"
      [(ngModel)]="nome"
      required
    >

    <label for="email">E-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="voce@email.com"
      [(ngModel)]="email"
      required
      email
    >

    <label for="senha">Senha</label>
    <input
      id="senha"
      name="senha"
      type="password"
      placeholder="Mínimo 8 caracteres"
      [(ngModel)]="senha"
      required
      minlength="8"
    >

    <label for="confirmarSenha">Confirmar senha</label>
    <input
      id="confirmarSenha"
      name="confirmarSenha"
      type="password"
      placeholder="Repita a senha"
      [(ngModel)]="confirmarSenha"
      required
    >

    <p class="mensagem" *ngIf="mensagem">
      {{ mensagem }}
    </p>

    <button type="submit">Criar conta</button>

  </form>
</div>
