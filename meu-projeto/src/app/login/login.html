<div class="login-container">

  <div class="logo">
    🌱
  </div>

  <h1>EcoBairro</h1>

  <p class="subtitulo">Reciclagem e cuidado do bairro</p>

  <div class="alternar">
    <a class="ativo" routerLink="/login">Entrar</a>
    <a routerLink="/cadastro">Criar conta</a>
  </div>

  <form>

    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      placeholder="voce@email.com"
    >

    <label for="senha">Senha</label>
    <input
      type="password"
      id="senha"
      placeholder="••••••••"
    >

    <button type="submit" class="botao">
      Entrar
    </button>

  </form>

  <a class="esqueci" href="#">
    Esqueci minha senha
  </a>

</div>
