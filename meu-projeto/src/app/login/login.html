```html
<div class="login-container">

  <div class="logo">🌱</div>
  <h1>EcoBairro</h1>
  <p class="subtitulo">Reciclagem e cuidado do bairro</p>

  <div class="alternar">
    <a class="ativo" routerLink="/login">Entrar</a>
    <a routerLink="/cadastro">Criar conta</a>
  </div>

  <form (ngSubmit)="entrar()" #formLogin="ngForm">

    <label for="email">E-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="voce@email.com"
      [(ngModel)]="email"
      required
      email
    >

    <label for="senha">Senha</label>
    <input
      id="senha"
      name="senha"
      type="password"
      placeholder="Digite sua senha"
      [(ngModel)]="senha"
      required
    >

    <p class="mensagem" *ngIf="mensagem">
      {{ mensagem }}
    </p>

    <button type="submit">Entrar</button>

  </form>

  <a class="esqueci" href="#" (click)="esqueciSenha($event)">
    Esqueci minha senha
  </a>

</div>
